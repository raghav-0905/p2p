apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: p2p
  labels:
    app: embedding-service
spec:
  # Singleton to prevent concurrent polling race conditions on Supabase
  replicas: 1
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      labels:
        app: embedding-service
    spec:
      containers:
        - name: embedding-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/p2p-embedding-service:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
            - name: PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: PINECONE_API_KEY
            - name: PINECONE_INDEX_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: PINECONE_INDEX_NAME
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-svc
  namespace: p2p
spec:
  selector:
    app: embedding-service
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
  type: ClusterIP
